name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile public scripts
        run: python -m compileall -q examples experiments
      - name: Test
        run: pytest
